name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Test interactive dashboard analysis engine
        run: node --test tests/dashboard_*.test.js
      - name: Build NASA OSDR dataset JSON
        run: PYTHONPATH=src python -m astra.osdr --input data/nasa/osd569/LSDS-7_Complete_Blood_Count_CBC.upload_SUBMITTED.csv --output /tmp/osd569-cbc.json

      - name: Build complete static website bundle
        run: python scripts/build_site.py --output /tmp/astra-site
      - name: Verify published website files
        run: |
          test -s /tmp/astra-site/index.html
          test -s /tmp/astra-site/dashboard/index.html
          test -s /tmp/astra-site/dashboard/app.js
          test -s /tmp/astra-site/sw.js
          grep -q 'id="run-analysis"' /tmp/astra-site/dashboard/index.html
          grep -q 'id="indicator-cards"' /tmp/astra-site/dashboard/index.html
          grep -q 'id="csv-file"' /tmp/astra-site/dashboard/index.html
          test -s /tmp/astra-site/output/demo-report.json
          test -s /tmp/astra-site/data/nasa/osd569-cbc.json
